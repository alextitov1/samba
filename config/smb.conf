[global]
   server role = standalone server
   server min protocol = SMB3
   server max protocol = SMB3

   # Preserve the case supplied for long file names.
   preserve case = yes
   # Preserve the case supplied for 8.3-style short names.
   short preserve case = yes
   # Use lowercase when a client does not specify name case.
   default case = lower

   # Do not synchronize Samba passwords to Unix passwords.
   unix password sync = no
   # Map unknown account names to the configured guest account.
   map to guest = Bad User
   # Permit guest access in user-created shares when enabled.
   usershare allow guests = yes

   # Grant owner/group write access on newly created files.
   create mask = 0664
   # Always grant owner/group write access on new files.
   force create mode = 0664
   # Grant owner/group full access on newly created directories.
   directory mask = 0775
   # Always grant owner/group full access on new directories.
   force directory mode = 0775

   # Perform share file operations as the container's Samba user.
   force user = samba
   # Perform share file operations as the container's Samba group.
   force group = samba
   # Allow symlinks whose targets remain within the share boundary.
   follow symlinks = yes

   # Avoid strict byte-range lock checks for ordinary I/O.
   strict locking = no
   # Disable the legacy size threshold for asynchronous reads.
   aio read size = 0
   # Disable the legacy size threshold for asynchronous writes.
   aio write size = 0

   # Retain filename mapping, Apple metadata, and alternate data stream support.
   vfs objects = catia fruit streams_xattr

   # Remove empty AppleDouble metadata files.
   fruit:delete_empty_adfiles = yes
   # Advertise shares as compatible macOS Time Machine destinations.
   fruit:time machine = yes
   # Let the fruit module process AppleDouble files instead of vetoing them.
   fruit:veto_appledouble = no
   # Remove intentionally empty Apple resource forks.
   fruit:wipe_intentionally_left_blank_rfork = yes

   # Disable NetBIOS and serve direct-hosted SMB only.
   disable netbios = yes
   # Listen only on the direct-hosted SMB port.
   smb ports = 445

   # Disable printer-share discovery.
   load printers = no
   # Select the inert BSD printing backend.
   printing = bsd
   # Prevent Samba from reading a real printer capability database.
   printcap name = /dev/null
   # Disable the remote print-spooler service.
   disable spoolss = yes

   # Send Samba logs to the container's standard output.
   log file = /dev/stdout
   logging = file
   max log size = 0

   # Load share configuration generated by startup sources.
   include = /run/samba/shares.conf
