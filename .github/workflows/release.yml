name: Publish container image

on:
  push:
    tags: ["v*"]
  # Dispatched by the Samba update workflow after it pushes a tag: a tag
  # pushed with GITHUB_TOKEN does not itself trigger workflows.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKERHUB_IMAGE: 4esnok/samba

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Require a version tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "::error::this workflow must run on a v* tag, got $GITHUB_REF"; exit 1 ;;
          esac

      - uses: actions/checkout@v7

      - name: Prepare platform tag
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=release-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=release-${{ env.PLATFORM_PAIR }}
          outputs: type=image,"name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE }}
          # The mutable series tag (v4.24.6-2 -> 4.24) uses `match` rather than
          # `semver`: the build-revision suffix makes the git tag a semver
          # prerelease, for which {{major}}.{{minor}} is never emitted.
          tags: |
            type=semver,pattern={{version}}
            type=match,pattern=v(\d+\.\d+),group=1
            type=raw,value=latest

      - name: Create manifest lists and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          for image_ref in "$REGISTRY_REF" "$DOCKERHUB_REF"; do
            tag_args=()
            while IFS= read -r tag; do
              tag_args+=(-t "$tag")
            done < <(jq -r --arg ref "$image_ref" '.tags[] | select(startswith($ref + ":"))' <<< "$DOCKER_METADATA_OUTPUT_JSON")

            digest_args=()
            for sha in *; do
              digest_args+=("${image_ref}@sha256:${sha}")
            done

            docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"
          done
        env:
          REGISTRY_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DOCKERHUB_REF: ${{ env.DOCKERHUB_IMAGE }}

      - name: Inspect published images
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          docker buildx imagetools inspect ${{ env.DOCKERHUB_IMAGE }}:${{ steps.meta.outputs.version }}
